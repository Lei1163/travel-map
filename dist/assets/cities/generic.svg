<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <radialGradient id="vignette" cx="50%" cy="45%" r="72%"><stop offset="55%" stop-color="#0b1d1a" stop-opacity="0"/><stop offset="100%" stop-color="#081512" stop-opacity="0.52"/></radialGradient>

  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173b35"/><stop offset=".55" stop-color="#35655b"/><stop offset="1" stop-color="#d39568"/></linearGradient>
  <radialGradient id="glow" cx="30%" cy="30%" r="80%"><stop stop-color="#d9b281" stop-opacity=".5"/><stop offset="1" stop-color="#0f2823" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1200" height="800" fill="url(#sky)"/>
<rect width="1200" height="800" fill="url(#glow)"/>
<g stroke="#f3e8d1" fill="none" opacity=".28">
  <circle cx="600" cy="400" r="250"/><circle cx="600" cy="400" r="185"/><circle cx="600" cy="400" r="120"/>
  <path d="M600 120 V680 M320 400 H880"/><path d="M420 220 L780 580 M780 220 L420 580"/>
</g>
<g fill="none" stroke="#f3e8d1" opacity=".7">
  <path d="M600 245 L635 365 L755 400 L635 435 L600 555 L565 435 L445 400 L565 365Z" stroke-width="2"/>
</g>
<circle cx="600" cy="400" r="12" fill="#e9c08b"/>

<rect width="1200" height="800" fill="url(#vignette)"/>
<rect width="1200" height="800" filter="url(#grain)" opacity="0.08" style="mix-blend-mode:overlay"/>
</svg>